<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0c0d0d" />
<title>Viora AI</title>
<meta name="description" content="Viora AI — собственный ассистент. Чистый интерфейс, естественные ответы." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/atom-one-dark.min.css" />
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="bg-base"></div>
  <div class="bg-grid"></div>
  <div class="bg-ray"></div>
  <div class="bg-dot"></div>
  <div class="bg-vignette"></div>
</div>

<aside id="sidebar" class="sidebar">
  <div class="sidebar-head">
    <button id="toggleSidebar" class="side-icon-btn" aria-label="Скрыть панель" title="Скрыть панель">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <path d="M9 4v16"/>
      </svg>
    </button>
    <button id="newChat" class="new-chat-btn" aria-label="Новый чат">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14"/>
        <path d="M5 12h14"/>
      </svg>
      <span>Новый чат</span>
    </button>
  </div>
  <div class="sidebar-search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"/>
      <path d="M21 21l-4.3-4.3"/>
    </svg>
    <input id="searchChats" type="text" placeholder="Поиск по чатам" />
  </div>
  <div class="sidebar-section-title">Недавние</div>
  <nav id="chatList" class="chat-list" aria-label="Список чатов"></nav>
</aside>

<button id="openSidebar" class="open-sidebar-btn" aria-label="Открыть панель" title="Открыть панель">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="16" rx="2"/>
    <path d="M9 4v16"/>
  </svg>
</button>

<div id="sidebarBackdrop" class="sidebar-backdrop"></div>

<header class="topbar">
  <div class="brand">
    <button id="openSidebarMobile" class="mobile-menu-btn" aria-label="Меню">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <path d="M9 4v16"/>
      </svg>
    </button>
    <div class="brand-mark" aria-hidden="true">
      <span class="brand-letter">V</span>
    </div>
    <div class="brand-text">
      <span class="brand-name silver-sheen">
        <span class="brand-name-text">Viora<span class="brand-ai"> AI</span></span>
        <span class="brand-sparks" aria-hidden="true">
          <span class="spark spark-1"></span>
          <span class="spark spark-2"></span>
          <span class="spark spark-3"></span>
          <span class="spark spark-4"></span>
          <span class="spark spark-5"></span>
        </span>
      </span>
      <span class="brand-sub">your private assistant</span>
    </div>
  </div>
  <div class="topbar-right">
    <div class="status">
      <span class="dot"></span>
      <span class="status-text">online</span>
    </div>
    <button id="clear" class="icon-btn" aria-label="Очистить чат" title="Очистить">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 6h18"/>
        <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
      </svg>
    </button>
  </div>
</header>

<main class="stage">
  <section id="welcome" class="welcome">
    <div class="welcome-badge">
      <span class="welcome-dot"></span>
      Powered by Viora intelligence
    </div>
    <h1 class="welcome-title silver-sheen">Здравствуй. Чем могу быть полезен?</h1>
    <p class="welcome-sub">Спрашивай о коде, идеях, текстах или просто поболтаем.</p>
    <div class="suggestions">
      <button class="chip" data-prompt="Объясни простыми словами, как работают трансформеры в нейросетях.">
        <span class="chip-icon">◇</span>
        Как работают трансформеры
      </button>
      <button class="chip" data-prompt="Напиши функцию на TypeScript для дебаунса с типизацией.">
        <span class="chip-icon">⌘</span>
        Debounce на TypeScript
      </button>
      <button class="chip" data-prompt="Дай 5 необычных идей для пет-проекта, которые впечатлят на собеседовании.">
        <span class="chip-icon">✦</span>
        Идеи pet-проектов
      </button>
      <button class="chip" data-prompt="Сравни React и Vue с точки зрения архитектуры, без хайпа и фанатизма.">
        <span class="chip-icon">↯</span>
        React vs Vue по делу
      </button>
    </div>
  </section>

  <section id="chat" class="chat" aria-live="polite"></section>
</main>

<form class="composer" id="composer" autocomplete="off">
  <div class="composer-glass">
    <textarea
      id="input"
      rows="1"
      placeholder="Спроси Viora..."
      maxlength="4000"
      aria-label="Сообщение"
    ></textarea>
    <button type="submit" id="send" aria-label="Отправить">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V5"/>
        <path d="M5 12l7-7 7 7"/>
      </svg>
    </button>
  </div>
</form>

<a class="tg-fab" href="https://t.me/VioraStudio" target="_blank" rel="noopener noreferrer" aria-label="Viora Studio в Telegram" title="Viora Studio в Telegram">
  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
    <path d="M9.04 15.47l-.39 4.06c.56 0 .8-.24 1.1-.53l2.63-2.51 5.45 3.98c1 .55 1.71.26 1.97-.92l3.57-16.74c.33-1.46-.53-2.04-1.5-1.68L1.36 9.36C-.07 9.92-.05 10.73 1.11 11.1l5.36 1.67L18.9 5.13c.59-.39 1.12-.18.68.22"/>
  </svg>
</a>

<script src="app.js"></script>
</body>
</html>
